<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6EE7B7 0%, #3B82F6 100%);
            background-attachment: fixed;
            transition: background-color 0.3s ease;
        }
        .task-enter {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .task-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
        }
        .container {
            backdrop-filter: blur(12px);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        #gameModal {
            display: none;
            background: rgba(0, 0, 0, 0.6);
            transition: background-color 0.3s ease;
        }
        .dark body {
            background: linear-gradient(135deg, #2D3748 0%, #1A202C 100%);
        }
        .dark .container {
            background: rgba(45, 55, 72, 0.9);
            color: #E2E8F0;
        }
        .dark .task-hover:hover {
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
        }
        .dark input, .dark button {
            background: #4A5568;
            color: #E2E8F0;
            border-color: #718096;
        }
        .dark input:focus {
            border-color: #6366F1;
            ring-color: #6366F1;
        }
        .dark #clock, .dark h1, .dark .task-text {
            color: #E2E8F0;
        }
        .dark .game-modal {
            background: #2D3748;
            color: #E2E8F0;
        }
        .toggle-btn {
            position: relative;
            width: 48px;
            height: 24px;
            background: #D1D5DB;
            border-radius: 9999px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .toggle-btn::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: #FFFFFF;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }
        .dark .toggle-btn {
            background: #6366F1;
        }
        .dark .toggle-btn::after {
            transform: translateX(24px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="container rounded-3xl shadow-2xl w-full max-w-lg p-10">
        <!-- Clock and Dark Mode Toggle -->
        <div class="flex justify-between items-center mb-8">
            <div id="clock" class="text-2xl font-semibold text-gray-900"></div>
            <div class="toggle-btn" onclick="toggleDarkMode()"></div>
        </div>

        <h1 class="text-4xl font-bold text-gray-900 mb-10 text-center">To-Do List</h1>
        
        <!-- Input Form -->
        <div class="flex mb-10">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Add a new task..." 
                class="flex-1 p-4 rounded-l-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white shadow-sm transition"
            >
            <button 
                onclick="addTask()" 
                class="bg-indigo-600 text-white p-4 rounded-r-xl hover:bg-indigo-700 transition duration-300 font-medium"
            >
                Add
            </button>
        </div>

        <!-- Task List -->
        <ul id="taskList" class="space-y-4"></ul>
    </div>

    <!-- Game Modal -->
    <div id="gameModal" class="fixed inset-0 flex items-center justify-center">
        <div class="game-modal bg-white rounded-xl p-8 w-full max-w-sm shadow-2xl">
            <h2 class="text-2xl font-bold text-gray-900 mb-4">🎉 Number Guessing Game</h2>
            <p class="text-gray-600 mb-6">All tasks done! Guess a number between 1 and 100.</p>
            <input 
                type="number" 
                id="guessInput" 
                placeholder="Your guess" 
                class="w-full p-3 mb-6 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white transition"
            >
            <p id="gameFeedback" class="text-gray-600 mb-6"></p>
            <div class="flex justify-end space-x-4">
                <button 
                    onclick="makeGuess()" 
                    class="bg-indigo-600 text-white px-5 py-2 rounded-lg hover:bg-indigo-700 transition font-medium"
                >
                    Guess
                </button>
                <button 
                    onclick="closeGame()" 
                    class="bg-gray-300 text-gray-900 px-5 py-2 rounded-lg hover:bg-gray-400 transition font-medium"
                >
                    Close
                </button>
            </div>
        </div>
    </div>

    <script>
        // Load tasks and theme from localStorage
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let isDarkMode = JSON.parse(localStorage.getItem('darkMode')) || false;
        let gameNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;

        // Apply theme on load
        document.addEventListener('DOMContentLoaded', () => {
            if (isDarkMode) {
                document.body.classList.add('dark');
            }
            renderTasks();
            updateClock();
        });

        // Clock functionality
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('clock').textContent = timeString;
        }
        setInterval(updateClock, 1000);

        // Dark mode toggle
        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark');
            localStorage.setItem('darkMode', JSON.stringify(isDarkMode));
        }

        function addTask() {
            const taskInput = document.getElementById('taskInput');
            const taskText = taskInput.value.trim();

            if (taskText === '') {
                alert('Please enter a task!');
                return;
            }

            const task = {
                id: Date.now(),
                text: taskText,
                completed: false
            };

            tasks.push(task);
            saveTasks();
            renderTasks();
            taskInput.value = '';
            document.getElementById('gameModal').style.display = 'none';
        }

        function toggleTask(id) {
            tasks = tasks.map(task => 
                task.id === id ? { ...task, completed: !task.completed } : task
            );
            saveTasks();
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveTasks();
            renderTasks();
        }

        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function renderTasks() {
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = '';

            tasks.forEach(task => {
                const li = document.createElement('li');
                li.className = 'flex items-center justify-between p-4 bg-white dark:bg-gray-700 rounded-xl shadow-sm task-enter task-hover transition duration-200';
                
                li.innerHTML = `
                    <div class="flex items-center">
                        <input 
                            type="checkbox" 
                            ${task.completed ? 'checked' : ''} 
                            onchange="toggleTask(${task.id})"
                            class="h-5 w-5 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer"
                        >
                        <span class="ml-3 text-lg task-text ${task.completed ? 'line-through text-gray-400 dark:text-gray-500' : 'text-gray-900 dark:text-gray-200'}">
                            ${task.text}
                        </span>
                    </div>
                    <button 
                        onclick="deleteTask(${task.id})"
                        class="text-red-500 hover:text-red-600 dark:hover:text-red-400 font-medium transition"
                    >
                        Delete
                    </button>
                `;

                taskList.appendChild(li);
            });

            // Show game modal if no tasks
            if (tasks.length === 0) {
                document.getElementById('gameModal').style.display = 'flex';
                resetGame();
            }
        }

        // Game logic
        function makeGuess() {
            const guessInput = document.getElementById('guessInput');
            const guess = parseInt(guessInput.value);
            const feedback = document.getElementById('gameFeedback');
            attempts++;

            if (isNaN(guess) || guess < 1 || guess > 100) {
                feedback.textContent = 'Please enter a number between 1 and 100!';
                feedback.className = 'text-red-500 dark:text-red-400 mb-6';
                return;
            }

            if (guess === gameNumber) {
                feedback.textContent = `Congratulations! You guessed it in ${attempts} attempts!`;
                feedback.className = 'text-green-600 dark:text-green-400 mb-6';
            } else if (guess < gameNumber) {
                feedback.textContent = 'Too low! Try a higher number.';
                feedback.className = 'text-gray-600 dark:text-gray-400 mb-6';
            } else {
                feedback.textContent = 'Too high! Try a lower number.';
                feedback.className = 'text-gray-600 dark:text-gray-400 mb-6';
            }

            guessInput.value = '';
        }

        function resetGame() {
            gameNumber = Math.floor(Math.random() * 100) + 1;
            attempts = 0;
            document.getElementById('gameFeedback').textContent = '';
            document.getElementById('guessInput').value = '';
        }

        function closeGame() {
            document.getElementById('gameModal').style.display = 'none';
            resetGame();
        }

        // Add task on Enter key press
        document.getElementById('taskInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        // Guess on Enter key press
        document.getElementById('guessInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                makeGuess();
            }
        });
    </script>
</body>
</html>
